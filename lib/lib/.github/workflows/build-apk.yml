name: Android APK yig'ish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android loyihasini yaratish
        run: |
          flutter create --platforms=android --org uz.moliya --project-name moliya_app build_app
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib build_app/test build_app/analysis_options.yaml
          cp -r lib build_app/lib

      - name: Paketlarni olish
        working-directory: build_app
        run: flutter pub get

      - name: APK yig'ish
        working-directory: build_app
        run: flutter build apk --release

      - name: APK ni nomlash
        run: cp build_app/build/app/outputs/flutter-apk/app-release.apk moliya.apk

      - name: Releases bo'limiga qo'yish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: moliya.apk
